<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Hub | Registration and Contact</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: 36px 20px;
			display: grid;
			place-items: center;
			color: #f5f7f6;
			font-family: Georgia, 'Times New Roman', serif;
			background: #162a2b url('images/1653903314142198723_3418152504953493_7608013727901633946_n.webp') center / cover fixed;
		}

		.form-panel {
			width: min(100%, 720px);
			padding: 32px;
			border: 1px solid rgba(255, 255, 255, 0.32);
			border-radius: 8px;
			background: rgba(12, 25, 26, 0.9);
			box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
		}

		.eyebrow {
			margin: 0 0 8px;
			color: #a9d7c4;
			font: 700 13px/1.4 Arial, sans-serif;
			text-align: center;
			text-transform: uppercase;
		}

		h1 {
			margin: 0 0 28px;
			font-size: 34px;
			font-weight: 500;
			text-align: center;
		}

		form {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 20px 18px;
		}

		.form-group {
			min-width: 0;
		}

		.form-group.full-width {
			grid-column: 1 / -1;
		}

		label,
		legend {
			display: block;
			margin-bottom: 8px;
			color: #f5f7f6;
			font: 600 15px/1.4 Arial, sans-serif;
		}

		input:not([type="radio"]),
		select,
		textarea {
			width: 100%;
			min-height: 46px;
			padding: 11px 12px;
			border: 1px solid #aab8b2;
			border-radius: 4px;
			color: #172322;
			background: #fff;
			font: 16px Arial, sans-serif;
		}

		textarea {
			min-height: 118px;
			resize: vertical;
		}

		input:focus,
		select:focus,
		textarea:focus,
		button:focus-visible {
			outline: 3px solid #e7b45d;
			outline-offset: 2px;
		}

		fieldset {
			min-width: 0;
			margin: 0;
			padding: 0;
			border: 0;
		}

		legend {
			padding: 0;
		}

		.gender-options {
			display: flex;
			flex-wrap: wrap;
			gap: 10px 20px;
		}

		.gender-options label {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			margin: 0;
			font-weight: 400;
		}

		.gender-options input {
			width: 16px;
			height: 16px;
			margin: 0;
			accent-color: #a9d7c4;
		}

		button {
			min-height: 48px;
			border: 0;
			border-radius: 4px;
			color: #142523;
			background: #a9d7c4;
			font: 700 16px Arial, sans-serif;
			cursor: pointer;
		}

		button:hover {
			background: #c2e5d6;
		}

		@media (max-width: 560px) {
			body {
				padding: 18px 12px;
				background-attachment: scroll;
			}

			.form-panel {
				padding: 24px 18px;
			}

			h1 {
				font-size: 28px;
			}

			form {
				grid-template-columns: 1fr;
				gap: 18px;
			}
		}
	</style>
</head>
<body>
	<main class="form-panel">
		<p class="eyebrow">Student Hub</p>
		<h1>Registration / Contact Form</h1>

		<form action="process.php" method="POST" id="registrationContactForm">
			<div class="form-group">
				<label for="fullName">Full Name</label>
				<input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="Enter your full name" required>
			</div>

			<div class="form-group">
				<label for="email">Email</label>
				<input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
			</div>

			<div class="form-group">
				<label for="mobile">Mobile Number</label>
				<input type="tel" id="mobile" name="mobile" autocomplete="tel" placeholder="Enter your mobile number" required>
			</div>

			<div class="form-group">
				<label for="course">Course</label>
				<select id="course" name="course" required>
					<option value="" disabled selected>Select your course</option>
					<option value="bca">BCA</option>
					<option value="bba">BBA</option>
					<option value="bcom">B.Com</option>
					<option value="ba">B.A.</option>
					<option value="bsc">B.Sc.</option>
					<option value="other">Other</option>
				</select>
			</div>

			<div class="form-group">
				<label for="year">Year</label>
				<select id="year" name="year" required>
					<option value="" disabled selected>Select your year</option>
					<option value="1">1st Year</option>
					<option value="2">2nd Year</option>
					<option value="3">3rd Year</option>
					<option value="4">4th Year</option>
					<option value="other">Other</option>
				</select>
			</div>

			<fieldset class="form-group">
				<legend>Gender</legend>
				<div class="gender-options">
					<label><input type="radio" name="gender" value="female" required> Female</label>
					<label><input type="radio" name="gender" value="male"> Male</label>
					<label><input type="radio" name="gender" value="other"> Other</label>
					<label><input type="radio" name="gender" value="prefer-not-to-say"> Prefer not to say</label>
				</div>
			</fieldset>

			<div class="form-group full-width">
				<label for="message">Message</label>
				<textarea id="message" name="message" placeholder="Write your message" required></textarea>
			</div>

			<div class="form-group full-width">
				<button type="submit">Submit</button>
			</div>
		</form>
	</main>
</body>
</html>
