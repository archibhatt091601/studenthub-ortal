<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <form id="registrationForm" novalidate>
            <h1>Student Registration</h1>
            <p class="subtitle">Please fill in all required details.</p>

            <div class="form-group">
                <label for="name">Full Name <span>*</span></label>
                <input type="text" id="name" name="name" autocomplete="name"
                       placeholder="Enter your full name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email <span>*</span></label>
                <input type="email" id="email" name="email" autocomplete="email"
                       placeholder="example@email.com">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number <span>*</span></label>
                <input type="tel" id="mobile" name="mobile" autocomplete="tel"
                       placeholder="10-digit mobile number" maxlength="10">
                <small class="error" id="mobileError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password <span>*</span></label>
                <input type="password" id="password" name="password"
                       autocomplete="new-password" placeholder="Create a password">
                <div class="strength">
                    <div id="strengthBar"></div>
                </div>
                <small id="strengthText">Password strength: Not entered</small>
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password <span>*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       autocomplete="new-password" placeholder="Re-enter your password">
                <small class="error" id="confirmPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="course">Course <span>*</span></label>
                <select id="course" name="course">
                    <option value="">-- Select Course --</option>
                    <option value="Computer Engineering">Computer Engineering</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Electrical Engineering">Electrical Engineering</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                    <option value="Civil Engineering">Civil Engineering</option>
                </select>
                <small class="error" id="courseError"></small>
            </div>

            <fieldset>
                <legend>Year <span>*</span></legend>
                <label><input type="radio" name="year" value="1st Year"> 1st Year</label>
                <label><input type="radio" name="year" value="2nd Year"> 2nd Year</label>
                <label><input type="radio" name="year" value="3rd Year"> 3rd Year</label>
                <label><input type="radio" name="year" value="4th Year"> 4th Year</label>
                <small class="error" id="yearError"></small>
            </fieldset>

            <fieldset>
                <legend>Gender <span>*</span></legend>
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
                <small class="error" id="genderError"></small>
            </fieldset>

            <div class="terms">
                <label>
                    <input type="checkbox" id="terms" name="terms">
                    I agree to the terms and conditions. <span>*</span>
                </label>
                <small class="error" id="termsError"></small>
            </div>

            <button type="submit">Register</button>
            <p id="successMessage" class="success" role="alert"></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
