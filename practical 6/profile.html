<h2><span class="title-badge">Student Directory</span></h2>
<p class="data-intro">Browse student profiles. Search by name, enrollment, course, or email, then filter by course.</p>
<div class="data-controls" data-controls>
  <label>Search students<input type="search" data-search placeholder="Search the student directory"></label>
  <label>Course<select data-filter><option value="">All courses</option></select></label>
  <label>Sort by<select data-sort><option value="name-asc">Name (A–Z)</option><option value="name-desc">Name (Z–A)</option><option value="semester-asc">Semester (low to high)</option><option value="semester-desc">Semester (high to low)</option></select></label>
</div>
<p class="data-status" data-status role="status" aria-live="polite">Loading student profiles…</p>
<div class="data-grid" data-results></div>
<nav class="pagination" data-pagination aria-label="Student directory pages"></nav>

</div>
