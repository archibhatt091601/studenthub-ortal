<main>

<div class="page-box">

<h2><span class="title-badge">Upcoming Events</span></h2>
<p class="data-intro">Browse campus activities. Search by name, venue, or description, then filter and sort the results.</p>
<div class="data-controls" data-controls>
  <label>Search events<input type="search" data-search placeholder="Try “workshop” or “auditorium”"></label>
  <label>Category<select data-filter><option value="">All categories</option></select></label>
  <label>Sort by<select data-sort><option value="date-asc">Date (earliest first)</option><option value="date-desc">Date (latest first)</option><option value="title-asc">Title (A–Z)</option><option value="title-desc">Title (Z–A)</option></select></label>
</div>
<p class="data-status" data-status role="status" aria-live="polite">Loading events…</p>
<div class="data-grid" data-results></div>
<nav class="pagination" data-pagination aria-label="Events pages"></nav>

</div>
